name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, e.g. 0.2.0. Blank picks the latest vX.Y.Z tag on
          this repo plus one patch.
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./scripts/release.sh run

  verify:
    name: Verify brew install
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/verify-install.yml
    with:
      version: ${{ needs.release.outputs.version }}
